name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax gate
        run: python -m compileall -q readproof tests

      - name: Install (console script works)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          readproof demo > /dev/null
          readproof --help > /dev/null
          python -c "import readproof; print('version', readproof.__version__)"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Gate smoke — illegal transitions must exit 5
        run: |
          python - <<'PY'
          from readproof import states as s

          assert s.check_transition(s.UNREAD, s.FETCHED) == s.FETCHED
          for target in (s.READ_PARTIAL, s.READ_FULL, s.VERIFIED):
              try:
                  s.check_transition(s.FETCH_FAILED, target, via=s.MANUAL_UPLOAD)
              except s.IllegalTransition as exc:
                  assert exc.exit_code == 5
              else:
                  raise SystemExit("manual upload skipped the reading receipt: %s" % target)
          assert not s.can_write(s.FETCHED, "eight_questions")
          assert s.can_write(s.VERIFIED, "gap_entry")
          print("state machine gates hold")
          PY

      - name: CLI end-to-end (exit codes are the contract)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m readproof init
          python -m readproof add 07 --title "A Paper Title" --arxiv 2601.00001
          python -m readproof advance 07 FETCHED

          set +e
          python -m readproof add 08 --title "a paper title"; dup=$?
          python -m readproof advance 07 VERIFIED; jump=$?
          python -m readproof advance 07 READ_FULL; noreceipt=$?
          set -e

          test "$dup" = "2"       || { echo "duplicate: expected 2, got $dup"; exit 1; }
          test "$jump" = "5"      || { echo "illegal jump: expected 5, got $jump"; exit 1; }
          test "$noreceipt" = "6" || { echo "missing receipt: expected 6, got $noreceipt"; exit 1; }

          cat > receipt.json <<'JSON'
          {
            "number_with_locator": "Table II: 41.2 / 38.7 dB (p.5)",
            "hyperparameters": "lr=2e-4, iters=20k (sec IV-A, p.4)",
            "negative_quote": "we do not report results under motion blur (sec V-D, p.7)",
            "body_detail": "cosine schedule appears only in a p.3 footnote"
          }
          JSON

          python -m readproof receipt 07 --file receipt.json
          python -m readproof advance 07 READ_FULL
          python -m readproof advance 07 VERIFIED
          python -m readproof status 07
          python -m readproof list

          # receipt extraction: a full paper yields four fingerprints; an abstract
          # must be refused with exit 6 and must not move the paper.
          FIXTURES="$GITHUB_WORKSPACE/tests/fixtures"
          python -m readproof extract "$FIXTURES/full_paper.txt"

          set +e
          python -m readproof extract "$FIXTURES/abstract_only.txt"; abstract=$?
          set -e
          test "$abstract" = "6" || { echo "abstract-only: expected 6, got $abstract"; exit 1; }

          python -m readproof add 08 --title "Another Full Paper"
          python -m readproof advance 08 FETCHED
          set +e
          python -m readproof receipt 08 --from-text "$FIXTURES/abstract_only.txt"; bad=$?
          set -e
          test "$bad" = "6" || { echo "abstract receipt: expected 6, got $bad"; exit 1; }
          python -m readproof receipt 08 --from-text "$FIXTURES/full_paper.txt"
          python -m readproof advance 08 READ_FULL
          echo "cli end-to-end: ok"

      - name: PDF intake (integrity and identity, without a PDF parser)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export READPROOF_PDF_COMMAND="python $GITHUB_WORKSPACE/tests/fixtures/fake_extractor.py {}"
          F="$GITHUB_WORKSPACE/tests/fixtures"

          python -m readproof init
          python -m readproof add 10 --title "Dense Reconstruction of Degraded Scenes"
          python -m readproof intake 10 "$F/valid.pdf"

          python -m readproof add 11 --title "Something Else Entirely Different Here"

          set +e
          python -m readproof intake 10 "$F/truncated.pdf"; truncated=$?
          python -m readproof intake 10 "$F/not_a_pdf.pdf"; notpdf=$?
          python -m readproof intake 11 "$F/valid.pdf"; mismatch=$?
          set -e

          test "$truncated" = "8" || { echo "truncated: expected 8, got $truncated"; exit 1; }
          test "$notpdf" = "8"    || { echo "not a pdf: expected 8, got $notpdf"; exit 1; }
          test "$mismatch" = "9"  || { echo "mismatch: expected 9, got $mismatch"; exit 1; }

          # an accepted intake stops at FETCHED; the receipt still has to be earned
          set +e
          python -m readproof advance 10 READ_FULL; noreceipt=$?
          set -e
          test "$noreceipt" = "6" || { echo "post-intake READ_FULL: expected 6, got $noreceipt"; exit 1; }

          python -m readproof receipt 10 --from-pdf "$F/valid.pdf"
          python -m readproof advance 10 READ_FULL
          python -m readproof advance 10 VERIFIED
          python -m readproof status 10
          echo "pdf intake: ok"

      - name: Problem graph (vocabulary refuses to fork concepts)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          V="$GITHUB_WORKSPACE/tests/fixtures/vocab.tsv"

          python -m readproof vocab --file "$V" > /dev/null
          python -m readproof init
          for id in 01 02 03 04; do
            python -m readproof add "$id" --title "Paper $id on multi-robot mapping" > /dev/null
          done
          python -m readproof card 01 --solves "P-SCALE-01@sec III-A" --leaves-open "P-THEORY-01@sec V-D" --admits "L-ROBUST-01@sec V-C" --assumes "A-ASSUME-01@sec III-A" > /dev/null
          python -m readproof card 02 --solves "P-SCALE-01@sec IV" --leaves-open "P-THEORY-01@sec VI" --admits "L-ROBUST-01@sec V-B" --assumes "A-ASSUME-01@sec III" > /dev/null
          python -m readproof card 03 --leaves-open "P-THEORY-01@sec V" --admits "L-ROBUST-01@sec IV-D" --assumes "A-ASSUME-02@sec III-B" --criticizes-uncompared "M-SCALE-01@sec II-A" --anomaly "sec V-C Table 4=more agents, less uplink; unexplained" > /dev/null
          python -m readproof card 04 --leaves-open "P-SCALE-02@sec V" --admits "L-EVAL-01@sec IV" > /dev/null

          mkdir out
          python -m readproof graph build --vocab "$V" -o out
          test -s out/gap-table.md
          test -s out/graph.json
          grep -q "G1 consensus" out/gap-table.md
          grep -q "G6 anomaly" out/gap-table.md

          # an edge with no location is a recollection, not evidence
          python -m readproof card 04 --leaves-open "P-SCALE-02" > /dev/null
          set +e
          python -m readproof graph check --vocab "$V"; noloc=$?
          set -e
          test "$noloc" = "4" || { echo "missing location: expected 4, got $noloc"; exit 1; }

          # an unresolved phrase must land in triage, never in the graph
          python -m readproof card 04 --leaves-open "P-SCALE-77@sec V" > /dev/null
          set +e
          python -m readproof --json graph stats --vocab "$V" | grep -q '"triage": 1'; triage=$?
          set -e
          test "$triage" = "0" || { echo "triage pool did not receive the unknown node"; exit 1; }

          echo "problem graph: ok"

      - name: No third-party imports
        run: |
          python - <<'PY'
          import ast, pathlib

          allowed = {
              "__future__", "argparse", "difflib", "hashlib", "json", "mimetypes", "os",
              "posixpath", "re", "shlex", "shutil", "subprocess", "sys", "tempfile",
              "datetime", "pathlib", "unittest", "urllib", "http", "readproof",
          }
          bad = []
          for path in pathlib.Path("readproof").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:      # relative import inside the package
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  bad += ["%s: %s" % (path, n) for n in names if n and n not in allowed]
          if bad:
              raise SystemExit("unexpected imports:\n" + "\n".join(bad))
          print("stdlib only: ok")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: "true"

      - name: Built bundle has no remote requests
        run: |
          if grep -rIl --include='*.js' --include='*.css' -E 'https?://(fonts|cdn|unpkg|jsdelivr)' dist/; then
            echo "the bundle references a remote host; the UI must work offline"
            exit 1
          fi
          echo "dist is self-contained"

      - name: Server serves the API and the built app
        working-directory: .
        run: |
          set -euo pipefail
          python -m pip install -e . > /dev/null
          cd tests/fixtures
          python - <<'PY'
          from readproof.store import Ledger
          from readproof import states as s
          ledger = Ledger.open("/tmp/web-ledger.json", create=True)
          ledger.add("07", "A Full Paper For The Web Check", venue="CVPR 2026")
          ledger.advance("07", s.FETCHED)
          ledger.set_receipt("07", {
              "number_with_locator": "Table II: 41.2 dB (p.5)",
              "hyperparameters": "lr=1e-4 (sec IV-A, p.4)",
              "negative_quote": "we do not report motion blur (sec V-D, p.7)",
              "body_detail": "cosine schedule only in a p.3 footnote",
          })
          ledger.advance("07", s.READ_FULL)
          ledger.save()
          PY
          cd "$GITHUB_WORKSPACE"
          python -m readproof --ledger /tmp/web-ledger.json serve \
            --port 8011 --vocab vocab.tsv --web-dir web/dist &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8011/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8011/api/papers | grep -q '"count": 1'
          curl -sf http://127.0.0.1:8011/api/gaps | grep -q '"available": true'
          curl -sf http://127.0.0.1:8011/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8011/assets/missing.js)" = "200"
          echo "web: api + built app served"
